version: '3.8'

# TimeTracker Docker 部署 (SQLite 模式)
# 使用方法: docker-compose up -d --build

services:
  # Nginx: 托管前端静态文件 + 反向代理后端 API
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: timetracker_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - timetracker_network

  # Backend API (FastAPI + SQLite)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: timetracker_backend
    environment:
      - APP_NAME=TimeTracker
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/timetracker.db}
      - SECRET_KEY=${SECRET_KEY:-please-change-this-secret-key}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost","http://localhost:80"]}
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - timetracker_network

volumes:
  backend_data:
    name: timetracker_backend_data

networks:
  timetracker_network:
    name: timetracker_network
    driver: bridge
