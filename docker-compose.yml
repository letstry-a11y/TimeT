version: '3.8'

# TimeTracker 简化部署配置 (SQLite模式)
# 使用方法: docker-compose up -d --build

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: timetracker_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - timetracker_network

  # Backend API (FastAPI + SQLite)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: timetracker_backend
    environment:
      - APP_NAME=TimeTracker
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/timetracker.db}
      - SECRET_KEY=${SECRET_KEY:-please-change-this-secret-key}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost","http://localhost:80"]}
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - timetracker_network

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: timetracker_frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - timetracker_network

volumes:
  backend_data:
    name: timetracker_backend_data

networks:
  timetracker_network:
    name: timetracker_network
    driver: bridge
